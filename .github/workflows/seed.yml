name: Seed Demo Incident

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "demo-seed-bot"
          git config user.email "demo-seed-bot@users.noreply.github.com"

      - name: Seed the incident
        env:
          GITHUB_TOKEN: ${{ secrets.DEMO_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/seed-incident.js
